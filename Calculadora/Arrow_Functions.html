<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Functions</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>

    <main class="main">
        <div id="Resultado" class="Resultado">
            <h1> 0 </h1>
        </div>

        <div class="Clicavel">
            <div class="Numeros">
                <button id="bt_1" class="bt_numeros">
                    <h2>1</h2>
                </button>

                <button id="bt_2" class="bt_numeros">
                    <h2>2</h2>
                </button>

                <button id="bt_3" class="bt_numeros">
                    <h2>3</h2>
                </button>

                <button id="bt_4" class="bt_numeros">
                    <h2>4</h2>
                </button>

                <button id="bt_5" class="bt_numeros">
                    <h2>5</h2>
                </button>

                <button id="bt_6" class="bt_numeros">
                    <h2>6</h2>
                </button>
                    
                <button id="bt_7" class="bt_numeros">
                    <h2>7</h2>
                </button>

                <button id="bt_8" class="bt_numeros">
                    <h2>8</h2>
                </button>

                <button id="bt_9" class="bt_numeros">
                    <h2>9</h2>
                </button>

                <button id="bt_OvoPascoa" class="bt_numeros">
                    <img src="./imagens/img_Steve.png" alt="">
                </button>

                <button id="bt_0" class="bt_numeros">
                    <h2>0</h2>
                </button>

                <button id="bt_V" class="bt_numeros">
                    <h2>,</h2>
                </button>

            </div>

            <div class="operadores">
                <button id="bt_Mais" class="bt_op">
                    <h2>+</h2>
                </button>

                <button id="bt_Menos" class="bt_op">
                    <h2>-</h2>
                </button>

                <button id="bt_Mul" class="bt_op">
                    <h2>x</h2>
                </button>

                <button id="bt_Div" class="bt_op">
                    <h2>/</h2>
                </button>

                <button id="bt_Resultado" class="bt_R">
                    <h2>=</h2>
                </button>
            </div>
        
        </div>
    </main>
    
    <script src="./Script.js">

    </script>
